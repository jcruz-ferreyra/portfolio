<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1c1c1c;
            color: #ccc;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.95em;
            line-height: 1.7;
            padding: 2em;
            height: 100%;
            overflow-y: auto;
        }
        h3 {
            color: #fff;
            font-size: 1.1em;
            margin-bottom: 0.8em;
        }
        p {
            margin-bottom: 0.8em;
            color: #bbb;
        }
        ul {
            padding-left: 1.2em;
            margin-bottom: 0.8em;
            color: #bbb;
        }
        ul li {
            margin-bottom: 0.4em;
        }
        .tag {
            display: inline-block;
            background: #333;
            color: #aaa;
            font-size: 0.78em;
            padding: 0.2em 0.6em;
            border-radius: 3px;
            margin: 0.2em 0.2em 0 0;
        }
    </style>
</head>
<body>
    <h3>Project Title One</h3>
    <p>Short summary of what the project is about and why it matters.</p>
    <ul>
        <li>Key finding or method one</li>
        <li>Key finding or method two</li>
        <li>Key finding or method three</li>
    </ul>
    <p>
        <span class="tag">Python</span>
        <span class="tag">GIS</span>
        <span class="tag">Cluster Analysis</span>
    </p>
</body>
</html>
